      <rect x="498" y="394" width="22" height="22"/>
      <rect x="474" y="452" width="22" height="22"/>
      <rect x="526" y="506" width="22" height="22"/>
      <rect x="492" y="570" width="22" height="22"/>
    </g>

    <!-- pile of sand, stepped -->
    <path d="M396 660 V630 H426 V600 H456 V570 H486 V600 H516 V630 H530 V660 Z" stroke-width="10" fill="#f2c14e"/>
